<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu · UMI SUSHI Peniche</title><meta name="description" content="Menu de pratos UMI SUSHI Peniche"><link rel="stylesheet" href="styles.css"><style>
body{background:#211e1b;color:#f5ecdf}.menuPageHeader{position:sticky;top:0;z-index:30;background:#151413f2;border-bottom:1px solid #c4a06b66;padding:10px clamp(14px,4vw,60px);display:flex;align-items:center;gap:20px;justify-content:space-between}.menuPageHeader img{height:54px;width:54px;object-fit:contain}.menuPageHeader a{color:#ead4af}.menuPageHeader .back{font-size:13px}.menuPageHeader button{border:1px solid #d4b17a;background:transparent;color:#f5dcaf;padding:10px 14px}.menuIntro{text-align:center;padding:52px 18px 22px}.menuIntro h1{font-size:clamp(46px,7vw,78px);color:#e9c990;margin:8px}.menuIntro p{color:#c7b9a7;font-size:14px}.menuContainer{max-width:1260px;margin:auto;padding:15px 18px 80px}.menuTools{position:sticky;top:74px;z-index:20;background:#211e1bf5;padding:14px 0;border-bottom:1px solid #8b734b55}.menuTools input{width:100%;max-width:420px;border:1px solid #8b734b;background:#fffaf0;color:#241d18;padding:12px 14px;border-radius:3px}.menuCategories{display:flex;gap:8px;overflow-x:auto;padding:14px 0 5px;scrollbar-width:thin}.menuCategories button{flex:none;border:1px solid #9f8259;background:transparent;color:#ead8b8;padding:9px 12px;cursor:pointer}.menuCategories button.active{background:#d8b77f;color:#211e1b}.menuCount{color:#cbb58f;font-size:13px;padding:12px 0}.menuCards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.menuCard{background:#171615;border:1px solid #a98b5c55;overflow:hidden}.menuCard img{width:100%;height:190px;object-fit:cover;display:block;background:#3b3229}.menuCardBody{padding:13px}.menuCard small{color:#d4b581;font-size:12px}.menuCard h2{font:500 17px/1.4 'DM Sans',sans-serif;margin:7px 0;color:#f5eddf}.menuCard .secondary{font-size:12px;color:#b9aa96;margin:0}.menuFooter{text-align:center;padding:30px;border-top:1px solid #a98b5c44;color:#b7a58d;font-size:12px}@media(max-width:850px){.menuCards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.menuCards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menuCard img{height:145px}.menuCardBody{padding:10px}.menuCard h2{font-size:14px}.menuTools{top:74px}.menuIntro{padding:34px 12px 14px}}@media(max-width:350px){.menuCards{grid-template-columns:1fr}}
.menuCategorySection{margin:12px 0 36px;scroll-margin-top:220px}.menuSectionTitle{font:600 clamp(22px,3vw,32px)/1.3 "DM Sans",sans-serif;color:#e9c990;letter-spacing:.07em;margin:12px 0 20px;border-bottom:1px solid #9f825955;padding-bottom:12px}.menuCard h3{font:500 17px/1.4 "DM Sans",sans-serif;margin:7px 0;color:#f5eddf}@media(max-width:620px){.menuCard h3{font-size:14px}.menuCategorySection{margin-bottom:28px}}
</style></head><body><header class="menuPageHeader"><a href="index.html#home" aria-label="UMI SUSHI"><img src="assets/umi-logo-original.png" alt="UMI SUSHI"></a><a class="back" href="index.html#home" id="back">← Voltar ao início</a><button id="language" type="button">EN</button></header><div class="menuIntro"><span class="eyebrow">UMI SUSHI · PENICHE</span><h1 id="heading">O NOSSO MENU</h1><p id="subheading">Explore os nossos pratos · Sem preços individuais</p></div><main class="menuContainer"><div class="menuTools"><input id="search" type="search" placeholder="Pesquisar pratos ou códigos..." aria-label="Pesquisar pratos"><div class="menuCategories" id="categories"></div></div><p class="menuCount" id="count" role="status"></p><div class="menuCards" id="cards"></div></main><footer class="menuFooter">© UMI SUSHI PENICHE · <a href="index.html#booking">RESERVAS</a></footer><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('umi-lang')==='en'?'en':'pt',data={dishes:[],categories:[]},cat='all',activeCategory=null,observer=null;
const localFallback={'cat01':'assets/menu-tasting.jpeg','cat02':'assets/menu-tasting.jpeg'};
function fallback(d){const n=(d.pt+' '+d.en).toLowerCase();if(n.includes('sashimi'))return 'assets/menu-sashimi.jpeg';if(n.includes('nigiri'))return 'assets/menu-nigiri.jpeg';if(n.includes('uramaki'))return 'assets/menu-uramaki.jpeg';if(n.includes('gunkan'))return 'assets/menu-gunkan.jpeg';return d.fallback_image||localFallback[d.category]||'assets/menu-tasting.jpeg'}
function topOffset(){return (document.querySelector('.menuPageHeader')?.offsetHeight||74)+(document.querySelector('.menuTools')?.offsetHeight||130)+16}
function highlight(id,scrollTab=true){activeCategory=id;for(const b of $('categories').querySelectorAll('button')){const selected=b.dataset.category===id;b.classList.toggle('active',selected);if(selected&&scrollTab)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}}
function render(){
 document.documentElement.lang=lang;$('language').textContent=lang==='pt'?'EN':'PT';$('heading').textContent=lang==='pt'?'O NOSSO MENU':'OUR MENU';$('subheading').textContent=lang==='pt'?'Explore os nossos pratos · Sem preços individuais':'Explore our dishes · No individual prices';$('back').textContent=lang==='pt'?'← Voltar ao início':'← Back to home';$('search').placeholder=lang==='pt'?'Pesquisar pratos ou códigos...':'Search dishes or codes...';
 const tabs=$('categories');tabs.replaceChildren();const groups=[{id:'all',pt:'Todos',en:'All'},...data.categories];
 for(const g of groups){const b=document.createElement('button');b.type='button';b.dataset.category=g.id;b.textContent=g[lang]||g.pt||g.id;b.onclick=()=>{const term=$('search').value.trim();if(term)$('search').value='';if(g.id==='all'){cat='all';render();window.scrollTo({top:0,behavior:'smooth'});return}if(cat!=='all'){cat='all';render()}requestAnimationFrame(()=>{const section=document.getElementById('section-'+g.id);if(section){window.scrollTo({top:Math.max(0,section.getBoundingClientRect().top+window.scrollY-topOffset()),behavior:'smooth'});highlight(g.id)}})};tabs.append(b)}
 const term=$('search').value.toLocaleLowerCase().trim();const dishes=data.dishes.filter(d=>(cat==='all'||d.category===cat)&&(!term||[d.pt,d.en,d.number].some(v=>String(v||'').toLocaleLowerCase().includes(term))));$('count').textContent=(lang==='pt'?'Pratos: ':'Dishes: ')+dishes.length;
 const cards=$('cards');cards.replaceChildren();const byCategory=new Map();for(const d of dishes){if(!byCategory.has(d.category))byCategory.set(d.category,[]);byCategory.get(d.category).push(d)}
 const ordered=data.categories.filter(g=>byCategory.has(g.id));for(const g of ordered){const section=document.createElement('section');section.className='menuCategorySection';section.id='section-'+g.id;section.dataset.category=g.id;const title=document.createElement('h2');title.className='menuSectionTitle';title.textContent=g[lang]||g.pt;section.append(title);const grid=document.createElement('div');grid.className='menuCards';for(const d of byCategory.get(g.id)){const article=document.createElement('article');article.className='menuCard';const img=document.createElement('img');img.loading='lazy';img.alt=d[lang]||d.pt||'';const fb=fallback(d);img.src=d.image||fb;img.onerror=()=>{img.onerror=null;if(img.getAttribute('src')!==fb)img.src=fb;else img.style.display='none'};const body=document.createElement('div');body.className='menuCardBody';const code=document.createElement('small');code.textContent=d.number||'';const name=document.createElement('h3');name.textContent=d[lang]||d.pt||'';const secondary=document.createElement('p');secondary.className='secondary';secondary.textContent=d[lang==='pt'?'en':'pt']||'';body.append(code,name,secondary);article.append(img,body);grid.append(article)}section.append(grid);cards.append(section)}
 if(observer)observer.disconnect();const sections=[...cards.querySelectorAll('.menuCategorySection')];let ticking=false;function sync(){ticking=false;if(!sections.length)return;const threshold=topOffset()+30;let current=sections[0].dataset.category;for(const s of sections){if(s.getBoundingClientRect().top<=threshold)current=s.dataset.category;else break}if(activeCategory!==current)highlight(current)}
 if(window._umiMenuScrollHandler)window.removeEventListener('scroll',window._umiMenuScrollHandler);window._umiMenuScrollHandler=()=>{if(!ticking){ticking=true;requestAnimationFrame(sync)}};window.addEventListener('scroll',window._umiMenuScrollHandler,{passive:true});highlight(sections[0]?.dataset.category||'all',false);requestAnimationFrame(sync);
}
$('language').onclick=()=>{lang=lang==='pt'?'en':'pt';localStorage.setItem('umi-lang',lang);render()};$('search').addEventListener('input',render);
fetch('content/site.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{data={dishes:Array.isArray(x.dishes)?x.dishes:[],categories:Array.isArray(x.categories)?x.categories:[]};render()}).catch(e=>{$('count').textContent='Não foi possível carregar o menu. / Unable to load menu.';console.error(e)});
})();
</script></body></html>
