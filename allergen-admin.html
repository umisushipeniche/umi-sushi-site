<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>UMI SUSHI · 过敏原审核（测试版）</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#111412;color:#f3e9da}
*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#141614f8;border-bottom:1px solid #b69765;padding:15px max(16px,calc((100vw - 1250px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#e8c18b}h1{font-size:22px;margin:0;color:#edc992}main{max-width:1250px;margin:auto;padding:24px 16px 90px}p{line-height:1.55}.notice{border:1px solid #c59861;background:#29231b;padding:16px;border-radius:10px}.notice strong{color:#f8d698}.muted{color:#bdb4a6;font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;align-items:center}input[type=search],select{background:#252825;border:1px solid #84745d;border-radius:8px;color:#fff;padding:12px;font-size:15px}input[type=search]{min-width:230px;flex:2}select{flex:1;min-width:150px}button,.btn{border:1px solid #b9905e;background:#27241e;color:#f9e8ca;border-radius:8px;padding:10px 13px;cursor:pointer;font:inherit}button:hover,.btn:hover{background:#433727}button.primary{background:#b68b53;color:#17120e;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#222520;border:1px solid #635541;border-radius:9px;padding:12px;min-width:130px}.stat b{display:block;color:#edd39d;font-size:23px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:18px}.dish{border:1px solid #67563c;border-radius:12px;background:#1c201e;overflow:hidden}.head{display:flex;gap:13px;padding:15px;border-bottom:1px solid #383b35}.head img{width:95px;height:95px;object-fit:cover;border-radius:7px;background:#333}.head h2{margin:5px 0;font-size:17px}.code{color:#eec68b;font-size:14px}.status{font-size:12px;border:1px solid #977b50;color:#f2cb8c;padding:3px 7px;border-radius:12px;display:inline-block}.status.done{color:#a8e1ab;border-color:#557e54}.body{padding:15px}.allergens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.allergens label{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 5px;border:1px solid #41463d;border-radius:6px;cursor:pointer}.allergens label:has(input:checked){border-color:#c99f62;background:#382f23}input[type=checkbox]{accent-color:#cba062;width:17px;height:17px;flex:none}.fineprint{font-size:12px;color:#bfb2a1}.dietary{margin:15px 0;padding:12px;border:1px solid #648b65;background:#192a1d;border-radius:9px}.dietary strong{color:#b9e6b7}.dietary label{display:flex;gap:9px;align-items:center;margin-top:9px;cursor:pointer;font-weight:650}.verify{display:flex;align-items:flex-start;gap:8px;margin:16px 0 9px;font-size:13px;line-height:1.5}.verify input{margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.saved{color:#a8d8aa;font-size:12px}.empty{text-align:center;padding:32px}.modal{max-width:650px;background:#20241f;color:#f2e4ce;border:1px solid #b99461;border-radius:12px}.modal textarea{width:100%;min-height:180px;background:#101310;color:white;border:1px solid #777;padding:10px}.modal::backdrop{background:#000b}@media(max-width:500px){.allergens{grid-template-columns:1fr}.head img{width:78px;height:78px}main{padding-top:14px}}
</style></head><body>
<header><h1>UMI SUSHI · 过敏原审核</h1><nav><a href="menu.html" target="_blank" rel="noopener">查看测试菜单 ↗</a></nav></header>
<main>
<div class="notice"><strong>仅供内部审核 · 浏览器本地存储</strong><p>先核对实际配方、酱料、油炸设备及供应商标签，再确认。候选过敏原仅由菜名推断，可能缺漏或错误。这里的“确认”仅代表该道菜的配方信息经过你审核，不代表不存在交叉接触风险。</p><p>保存结果仅保存在此浏览器、此测试版域名；换设备/无痕窗口不会同步。请定期<strong>导出 JSON 备份</strong>。同一浏览器打开测试菜单时会显示已确认结果；不会影响正式网站。</p></div>
<div class="stats" id="stats" aria-live="polite"></div>
<div class="tools"><input id="search" type="search" placeholder="搜索编码 / 葡语 / 英语菜名" aria-label="搜索菜品"><select id="statusFilter" aria-label="审核状态"><option value="all">全部状态</option><option value="pending">待确认</option><option value="confirmed">已确认</option></select><select id="categoryFilter" aria-label="分类"><option value="all">全部分类</option></select></div>
<div class="tools"><button type="button" id="export" class="primary">导出审核 JSON 备份</button><button type="button" id="import">导入已有审核备份</button><button type="button" id="clear">清除本机审核数据</button><input type="file" id="file" accept=".json,application/json" hidden></div>
<p class="muted" id="savedAt"></p><div class="cards" id="cards" aria-live="polite">正在加载菜单…</div>
</main>
<script>
(()=>{'use strict';
const STORAGE='umi-allergen-review-v1';const $=id=>document.getElementById(id);
const A={gluten:['🌾','含麸质谷物','Glúten'],crustaceans:['🦐','甲壳类','Crustáceos'],eggs:['🥚','蛋','Ovos'],fish:['🐟','鱼','Peixe'],peanuts:['🥜','花生','Amendoins'],soy:['🫘','大豆','Soja'],milk:['🥛','牛奶','Leite'],nuts:['🌰','坚果','Frutos de casca rija'],celery:['🥬','芹菜','Aipo'],mustard:['Ⓜ','芥末','Mostarda'],sesame:['◉','芝麻','Sésamo'],sulphites:['SO₂','二氧化硫/亚硫酸盐','Sulfitos'],lupin:['🌱','羽扇豆','Tremoço'],molluscs:['🐚','软体动物','Moluscos']};
let dishes=[],categories=[],reviews={};
function safeRead(){try{const v=JSON.parse(localStorage.getItem(STORAGE)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}}
function validateEntry(x){return x&&typeof x==='object'&&Array.isArray(x.allergens)&&x.allergens.every(k=>Object.hasOwn(A,k))&&typeof x.confirmed==='boolean'&&(!x.updatedAt||typeof x.updatedAt==='string')}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(reviews));$('savedAt').textContent='本地保存时间：'+new Date().toLocaleString();return true}catch(e){alert('保存失败：浏览器可能阻止了本地存储。请导出备份。');return false}}
function rowStatus(d){return reviews[d.number]?.confirmed===true?'confirmed':'pending'}
function stats(){let n=dishes.filter(d=>rowStatus(d)==='confirmed').length;$('stats').innerHTML='<div class="stat"><b>'+dishes.length+'</b>全部菜品</div><div class="stat"><b>'+n+'</b>已确认</div><div class="stat"><b>'+(dishes.length-n)+'</b>待确认</div><div class="stat"><b>'+dishes.filter(d=>(d.allergen_candidates||[]).length).length+'</b>含候选提示</div>'}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function card(d){let record=reviews[d.number],confirmed=record?.confirmed===true;const section=el('section','dish');const head=el('div','head');const image=el('img');image.src=d.image||d.fallback_image||'';image.loading='lazy';image.alt=d.pt;image.onerror=()=>{image.onerror=null;image.src=d.fallback_image||'assets/menu-tasting.jpeg'};const meta=el('div');meta.append(el('span','code',d.number),el('h2','',d.pt),el('p','muted',d.en||''));const tag=el('span','status'+(confirmed?' done':''),confirmed?'已确认':'待确认');meta.append(tag);head.append(image,meta);
const body=el('div','body');body.append(el('p','fineprint','候选来自菜名（仅作参考）: '+((d.allergen_candidates||[]).map(k=>A[k]?.[1]||k).join('、')||'无可推断项；不代表无过敏原')));
const grid=el('div','allergens');const selected=Array.isArray(record?.allergens)?record.allergens:(d.allergen_candidates||[]).filter(k=>Object.hasOwn(A,k));const checks={};for(const [key,v]of Object.entries(A)){const label=el('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.includes(key);checks[key]=cb;label.append(cb,document.createTextNode(v[0]+' '+v[1]+' / '+v[2]));grid.append(label)}
const dietary=el('div','dietary');dietary.append(el('strong','','🌱 饮食标签 / Dietary labels'));const veganLabel=el('label');const vegan=document.createElement('input');vegan.type='checkbox';vegan.checked=record?.vegan===true;veganLabel.append(vegan,document.createTextNode('Vegan / 纯素 / Vegano（不含任何动物来源成分）'));dietary.append(veganLabel,el('p','fineprint','只有核实包括高汤、酱料、蛋、奶、鱼露及蜂蜜等所有配料后才可以选择。Vegan 不是过敏原。'));const verify=el('label','verify');const verified=document.createElement('input');verified.type='checkbox';verify.append(verified,document.createTextNode('我已与厨房核对这道菜的完整配方、酱料、调味料和供应商信息，并理解交叉接触风险需另行管理。'));
const action=el('div','actions');const draft=el('button','', '保存草稿');draft.type='button';const confirm=el('button','primary','确认此菜');confirm.type='button';const undo=el('button','','撤销确认');undo.type='button';undo.disabled=!confirmed;const msg=el('span','saved');function collect(isConfirmed){return{allergens:Object.entries(checks).filter(([,c])=>c.checked).map(([k])=>k),vegan:vegan.checked,confirmed:isConfirmed,updatedAt:new Date().toISOString()}}
function write(isConfirmed){reviews[d.number]=collect(isConfirmed);if(persist()){msg.textContent=isConfirmed?'已确认并保存':'草稿已保存在本机';setTimeout(()=>{if(msg.isConnected)msg.textContent=''},2500);stats();tag.textContent=isConfirmed?'已确认':'待确认';tag.classList.toggle('done',isConfirmed);undo.disabled=!isConfirmed;verified.checked=false;confirm.disabled=true}}
draft.onclick=()=>write(false);confirm.onclick=()=>{if(!verified.checked)return;write(true)};undo.onclick=()=>write(false);
confirm.disabled=true;verified.onchange=()=>{confirm.disabled=!verified.checked};for(const cb of [...Object.values(checks),vegan]){cb.onchange=()=>{verified.checked=false;confirm.disabled=true;if(reviews[d.number]?.confirmed){reviews[d.number]=collect(false);persist();tag.textContent='待确认';tag.classList.remove('done');undo.disabled=true;stats();msg.textContent='选择已变更，原确认已撤销'}else{msg.textContent='未保存的修改；请点击保存草稿或重新确认'}}}
action.append(draft,confirm,undo,msg);body.append(grid,dietary,verify,action);section.append(head,body);return section}
function render(){stats();const q=$('search').value.trim().toLocaleLowerCase();const s=$('statusFilter').value,c=$('categoryFilter').value;let list=dishes.filter(d=>(s==='all'||rowStatus(d)===s)&&(c==='all'||d.category===c)&&(!q||[d.number,d.pt,d.en].some(x=>String(x||'').toLocaleLowerCase().includes(q))));$('cards').replaceChildren(...list.map(card));if(!list.length)$('cards').append(el('p','empty','没有匹配的菜品'))}
$('search').oninput=render;$('statusFilter').onchange=render;$('categoryFilter').onchange=render;
$('export').onclick=()=>{const payload={format:'umi-allergen-review-v1',exportedAt:new Date().toISOString(),reviews};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='umi-allergens-review-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('文件过大');const obj=JSON.parse(await file.text());if(obj.format!=='umi-allergen-review-v1'||!obj.reviews||typeof obj.reviews!=='object'||Array.isArray(obj.reviews))throw Error('不是 UMI 审核备份');const known=new Set(dishes.map(d=>d.number)),items=Object.entries(obj.reviews);if(items.some(([id,v])=>!known.has(id)||!validateEntry(v)))throw Error('菜品或过敏原数据无效');if(!confirm('将导入 '+items.length+' 条审核记录，并覆盖本机对应菜品的记录。继续吗？'))return;reviews={...reviews,...obj.reviews};persist();render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
$('clear').onclick=()=>{if(confirm('确定清除这台浏览器上全部菜品审核结果？建议先导出备份。')&&confirm('再次确认：此操作无法撤销！')){reviews={};persist();render()}};
fetch('content/site.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{dishes=Array.isArray(data.dishes)?data.dishes:[];categories=Array.isArray(data.categories)?data.categories:[];reviews=safeRead();const select=$('categoryFilter');for(const c of categories){let opt=document.createElement('option');opt.value=c.id;opt.textContent=c.pt+' / '+c.en;select.append(opt)}render()}).catch(err=>{$('cards').textContent='无法加载菜单：'+err.message});
})();
</script></body></html>
