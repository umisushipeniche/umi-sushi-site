<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/umi-logo-original.png"><title>Verificar Voucher · UMI SUSHI Peniche</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#463528,#1b1714 65%);font:15px/1.5 system-ui,Arial,sans-serif;color:#f5e9db;display:flex;align-items:center;justify-content:center;padding:20px}.card{max-width:480px;width:100%;padding:30px;background:#2b231e;border:1px solid #b99866;border-radius:16px;box-shadow:0 14px 45px #0006}.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.brand img{width:66px;height:66px;object-fit:contain}.brand h1{font:normal 24px Georgia,serif;letter-spacing:1px;margin:0;color:#efd2a3}.brand small{color:#c9a56b;letter-spacing:2px;font-size:10px}.tag{display:inline-block;background:#45382a;border:1px solid #9b7c52;border-radius:30px;padding:4px 11px;font-size:11px;color:#edcb94}h2{font:normal 29px Georgia,serif;color:#ead0a6;margin:16px 0 10px}.value{font:normal 40px Georgia,serif;color:#f3cd91;margin:6px 0 17px}.state{border:1px solid #8d7459;border-radius:10px;padding:14px 16px;margin:15px 0;font-weight:650}.state.good{border-color:#75ae8a;color:#c6f0d1}.state.bad{border-color:#ca7777;color:#ffd4cb}.state.warn{border-color:#b6a072;color:#f1d7aa}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #564638}.row span{color:#c2b19f}.row strong{text-align:right;overflow-wrap:anywhere}.note{font-size:12px;color:#c6b8a8;line-height:1.7;margin-top:20px;border-top:1px solid #685139;padding-top:14px}.link{color:#f4d69e;text-decoration:none}input{width:100%;padding:12px;color:white;background:#1b1612;border:1px solid #947b58;border-radius:7px;font:inherit}button{background:#d6b27b;color:#261a10;border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}
</style></head><body><main class="card"><div class="brand"><img src="/assets/umi-logo-original.png" alt="UMI SUSHI"><div><h1>UMI SUSHI</h1><small>PENICHE · VOUCHER OFERTA</small></div></div><span class="tag">VERIFICAÇÃO ONLINE</span><h2>Verificar voucher</h2><div id="inputBox"><label for="code">Código do voucher</label><input id="code" autocapitalize="characters" placeholder="UMI-DEMO-..."><button id="check">Consultar</button></div><div id="result" aria-live="polite"></div><p class="note">A validade é verificada diretamente nos registos do restaurante. Apenas o administrador autorizado pode emitir, utilizar ou anular vouchers. A apresentação do QR não autoriza a utilização sem confirmação no restaurante.</p></main><script>
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',format=s=>s?s.split('-').reverse().join('/'):'—';
async function display(){
 const code=$('code').value.trim().toUpperCase(),out=$('result');out.replaceChildren();
 if(!/^UMI-[A-F0-9]{32}$/.test(code)){out.textContent='Código inválido. Introduza o código completo do voucher.';return}
 let r;
 try{const reply=await fetch('/api/voucher/verify?code='+encodeURIComponent(code),{cache:'no-store'}),j=await reply.json();if(!reply.ok)throw Error(j.error||'Voucher não encontrado');r=j.voucher}
 catch(e){let d=document.createElement('div');d.className='state warn';d.textContent='Não foi possível verificar';out.appendChild(d);let p=document.createElement('p');p.textContent=e.message+'. Não considere este voucher válido sem confirmação do restaurante.';out.appendChild(p);return}
 const state=r.status==='unused'?'Disponível':r.status==='used'?'Utilizado':r.status==='cancelled'?'Anulado':'Expirado';
 let banner=document.createElement('div');banner.className='state '+(state==='Disponível'?'good':'bad');banner.textContent=state;out.appendChild(banner);
 const add=(label,value)=>{let row=document.createElement('div');row.className='row';let a=document.createElement('span');a.textContent=label;let b=document.createElement('strong');b.textContent=value;row.append(a,b);out.appendChild(row)};
 add('Código',r.code);add('Tipo',r.kind==='value'?'Vale de Valor':(r.meal==='lunch'?'Almoço':'Jantar')+' · '+r.people+' pessoa'+(r.people===1?'':'s'));add('Valor',fmt(r.amount_cents/100));add('Data de Emissão',format(r.issued_at));add('Válido até',format(r.expires_at));
}
$('check').onclick=display;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')display()});const param=new URLSearchParams(location.search).get('code');if(param){$('code').value=param;display()} 
</script></body></html>
